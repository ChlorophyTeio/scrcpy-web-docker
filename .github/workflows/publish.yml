name: Build or publish images
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. 0.1.0 or 0.1.0-rc.1'
        required: true
        type: string
      publish:
        description: 'Upload to Docker Hub'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            suffix: ''
          - dockerfile: plugins/maa/Dockerfile
            suffix: '-maa'
          - dockerfile: cache/Dockerfile
            suffix: '-cache'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate version and publication settings
        env:
          VERSION: ${{ inputs.version }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'chlorophyimo' }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend/web-app
      - run: go test ./... && python3 tools/check-release.py
      - run: go test ./...
        working-directory: plugins/maa/worker
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build Android Agents
        if: matrix.suffix == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile.build
          outputs: type=local,dest=bin/agent
          cache-from: type=gha,scope=android-agent
          cache-to: type=gha,mode=max,scope=android-agent
      - name: Build scrcpy server
        if: matrix.suffix == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: third_party/scrcpy/Dockerfile.server
          outputs: type=local,dest=bin/scrcpy-server
          cache-from: type=gha,scope=scrcpy-server
          cache-to: type=gha,mode=max,scope=scrcpy-server
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'chlorophyimo' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || 'chlorophyimo' }}/${{ vars.IMAGE_NAME || 'scrcpycat' }}${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=unified${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=unified${{ matrix.suffix }}
