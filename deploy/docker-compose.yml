name: scrcpycat
services:
  scrcpy-web:
    image: ${SCRCPYCAT_IMAGE:-chlorophyimo/scrcpycat:0.1.6}
    restart: unless-stopped
    environment:
      SCRCPYCAT_PUBLIC_URL: ${SCRCPYCAT_PUBLIC_URL:-https://localhost:9015}
      SCRCPYCAT_ADMIN_USERNAME: ${SCRCPYCAT_ADMIN_USERNAME:-admin}
      SCRCPYCAT_ADMIN_PASSWORD: ${SCRCPYCAT_ADMIN_PASSWORD:?Run tools/init-env.py}
      SCRCPYCAT_JWT_SECRET: ${SCRCPYCAT_JWT_SECRET:?Run tools/init-env.py}
      SCRCPYCAT_POSTGRES_DSN: ${SCRCPYCAT_POSTGRES_DSN:?Configure PostgreSQL}
      SCRCPYCAT_REDIS_URL: redis://scrcpycat-cache:6379/0
      SCRCPYCAT_MAA_URL: http://maa-web:8080
      SCRCPYCAT_TURN_URLS: ${SCRCPYCAT_TURN_URLS:-stun:stun.cloudflare.com:3478}
      SCRCPYCAT_TURN_USERNAME: ${SCRCPYCAT_TURN_USERNAME:-}
      SCRCPYCAT_TURN_CREDENTIAL: ${SCRCPYCAT_TURN_CREDENTIAL:-}
      SCRCPYCAT_WEBRTC_HOST_IPS: ${SCRCPYCAT_WEBRTC_HOST_IPS:-127.0.0.1}
      SCRCPYCAT_WEBRTC_UDP_MIN: ${SCRCPYCAT_WEBRTC_UDP_MIN:-40000}
      SCRCPYCAT_WEBRTC_UDP_MAX: ${SCRCPYCAT_WEBRTC_UDP_MAX:-40100}
    ports:
      - '${SCRCPYCAT_HTTPS_PORT:-9015}:9443'
      - '${SCRCPYCAT_WEBRTC_UDP_MIN:-40000}-${SCRCPYCAT_WEBRTC_UDP_MAX:-40100}:${SCRCPYCAT_WEBRTC_UDP_MIN:-40000}-${SCRCPYCAT_WEBRTC_UDP_MAX:-40100}/udp'
    volumes:
      - appdata:/data
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rwm'
    depends_on:
      scrcpycat-cache:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    stop_grace_period: 30s
  postgres:
    image: postgres:17-alpine
    profiles: [database]
    restart: unless-stopped
    environment:
      POSTGRES_DB: scrcpycat
      POSTGRES_USER: scrcpycat
      POSTGRES_PASSWORD: ${SCRCPYCAT_POSTGRES_PASSWORD:?Run tools/init-env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scrcpycat -d scrcpycat']
      interval: 5s
      timeout: 3s
      retries: 10
  scrcpycat-cache:
    image: ${SCRCPYCAT_CACHE_IMAGE:-chlorophyimo/scrcpycat-cache:0.1.6}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      default:
        aliases: [redis]
  maa-web:
    image: ${SCRCPYCAT_MAA_IMAGE:-chlorophyimo/scrcpycat-maa:0.1.6}
    restart: unless-stopped
    environment:
      MAA_DEVICE: ${MAA_DEVICE:-}
      ADB_SERVER_SOCKET: tcp:scrcpy-web:5037
    volumes:
      - maa-config:/app/config
      - maa-data:/root/.local/share/maa
      - maa-cache:/root/.cache/maa
    depends_on:
      scrcpy-web:
        condition: service_healthy
    stop_grace_period: 40s
networks:
  default:
    name: ${SCRCPYCAT_NETWORK:-scrcpycat}
    external: ${SCRCPYCAT_EXTERNAL_NETWORK:-false}
volumes:
  appdata:
  postgres-data:
  redis-data:
  maa-config:
  maa-data:
  maa-cache:
