name: Verify
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend/web-app
      - run: go test -race ./...
      - run: go test -race ./...
        working-directory: plugins/maa/worker
      - run: python3 tools/check-release.py
      - run: bash -n docker/*.sh plugins/maa/docker/start.sh plugins/maa/docker/maa-phone-display
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
      - run: COMPOSE_PROFILES= docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config --quiet
      - name: Check host architecture compilation
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /tmp/controlplane-$arch ./backend/cmd/controlplane
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /tmp/agent-$arch ./agent/cmd/agent
          done
